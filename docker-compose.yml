version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbitos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/orbitos
      JWT_SECRET: change_me
      PORT: 3001
    ports:
      - '3001:3001'

  client:
    build: ./client
    ports:
      - '5173:5173'

volumes:
  pgdata:
